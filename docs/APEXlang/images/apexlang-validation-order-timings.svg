<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title description">
  <title id="title">APEXlang validation time in smallest-first and largest-first order</title>
  <desc id="description">Nine disconnected SQLcl validations per order. Smallest-first times in seconds are 12, 1, 1, 14, 9, 9, 29, 23, 22, totaling 120. Largest-first times are 59, 31, 30, 11, 10, 11, 1, 0, 1, totaling 154.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #25374a; }
    .title { font-size: 23px; font-weight: 700; }
    .sub { font-size: 13px; fill: #56687a; }
    .axis { font-size: 12px; fill: #56687a; }
    .band { font-size: 13px; font-weight: 700; }
    .legend { font-size: 14px; font-weight: 700; }
    .note { font-size: 12px; fill: #56687a; }
  </style>
  <rect width="1000" height="510" rx="16" fill="#ffffff"/>
  <text x="48" y="39" class="title">Validation time by run order</text>
  <text x="48" y="62" class="sub">One SQLcl session per order · no database connection · lower is faster</text>
  <line x1="555" y1="42" x2="588" y2="42" stroke="#1777a9" stroke-width="4" stroke-linecap="round"/>
  <text x="598" y="47" class="legend">Smallest first · 120 s total</text>
  <line x1="555" y1="66" x2="588" y2="66" stroke="#d15a36" stroke-width="4" stroke-linecap="round"/>
  <text x="598" y="71" class="legend">Largest first · 154 s total</text>

  <rect x="80" y="100" width="270" height="290" fill="#f1f6fa"/>
  <rect x="350" y="100" width="270" height="290" fill="#f8fafc"/>
  <rect x="620" y="100" width="270" height="290" fill="#f1f6fa"/>
  <text x="215" y="92" text-anchor="middle" class="band">Runs 1–3</text>
  <text x="485" y="92" text-anchor="middle" class="band">Runs 4–6</text>
  <text x="755" y="92" text-anchor="middle" class="band">Runs 7–9</text>

  <g stroke="#d6e0e7" stroke-width="1">
    <line x1="80" y1="390" x2="890" y2="390"/>
    <line x1="80" y1="318" x2="890" y2="318"/>
    <line x1="80" y1="246" x2="890" y2="246"/>
    <line x1="80" y1="174" x2="890" y2="174"/>
    <line x1="80" y1="102" x2="890" y2="102"/>
  </g>
  <g class="axis" text-anchor="end">
    <text x="68" y="394">0</text>
    <text x="68" y="322">15</text>
    <text x="68" y="250">30</text>
    <text x="68" y="178">45</text>
    <text x="68" y="106">60</text>
  </g>
  <text x="48" y="87" class="axis">Seconds</text>

  <path d="M80 390 L80 332.4 H170 V385.2 H260 V385.2 H350 V322.8 H440 V346.8 H530 V346.8 H620 V250.8 H710 V279.6 H800 V284.4 H890 V390 Z" fill="#1777a9" fill-opacity="0.16"/>
  <path d="M80 390 L80 106.8 H170 V241.2 H260 V246 H350 V337.2 H440 V342 H530 V337.2 H620 V385.2 H710 V390 H800 V385.2 H890 V390 Z" fill="#d15a36" fill-opacity="0.15"/>
  <path d="M125 332.4 L215 385.2 L305 385.2 L395 322.8 L485 346.8 L575 346.8 L665 250.8 L755 279.6 L845 284.4" fill="none" stroke="#1777a9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M125 106.8 L215 241.2 L305 246 L395 337.2 L485 342 L575 337.2 L665 385.2 L755 390 L845 385.2" fill="none" stroke="#d15a36" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#1777a9" stroke-width="2.5">
    <circle cx="125" cy="332.4" r="5"/><circle cx="215" cy="385.2" r="5"/><circle cx="305" cy="385.2" r="5"/>
    <circle cx="395" cy="322.8" r="5"/><circle cx="485" cy="346.8" r="5"/><circle cx="575" cy="346.8" r="5"/>
    <circle cx="665" cy="250.8" r="5"/><circle cx="755" cy="279.6" r="5"/><circle cx="845" cy="284.4" r="5"/>
  </g>
  <g fill="#ffffff" stroke="#d15a36" stroke-width="2.5">
    <circle cx="125" cy="106.8" r="5"/><circle cx="215" cy="241.2" r="5"/><circle cx="305" cy="246" r="5"/>
    <circle cx="395" cy="337.2" r="5"/><circle cx="485" cy="342" r="5"/><circle cx="575" cy="337.2" r="5"/>
    <circle cx="665" cy="385.2" r="5"/><circle cx="755" cy="390" r="5"/><circle cx="845" cy="385.2" r="5"/>
  </g>
  <g class="axis" text-anchor="middle">
    <text x="125" y="411">1</text><text x="215" y="411">2</text><text x="305" y="411">3</text>
    <text x="395" y="411">4</text><text x="485" y="411">5</text><text x="575" y="411">6</text>
    <text x="665" y="411">7</text><text x="755" y="411">8</text><text x="845" y="411">9</text>
  </g>
  <text x="485" y="435" text-anchor="middle" class="axis">Chronological validation number</text>
  <text x="485" y="461" text-anchor="middle" class="note">The lines validate different page counts at the same run number; see the tables for each sequence.</text>
  <text x="485" y="482" text-anchor="middle" class="note">Each shaded step is one timed run. The total shaded area is proportional to the nine-run total.</text>
</svg>
